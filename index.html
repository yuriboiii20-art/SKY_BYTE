<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SKY-BYTE</title>
  <!-- 🌐 Favicon (Tab Logo) -->
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="shortcut icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="weather-default">

  <!-- 🌤 Dynamic Weather Effects Container -->
  <div id="weather-fx" class="weather-fx-container">
    <!-- Sunny / Clear FX -->
    <div class="sun-glow"></div>

    <!-- Rain / Drizzle / Snow Canvas FX -->
    <canvas id="precip-canvas"></canvas>

    <!-- Lightning Flash FX -->
    <div id="lightning-flash" class="lightning-flash"></div>

    <!-- Animated Clouds FX -->
    <div class="clouds-bg">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>
  </div>

  <div class="app fade-in">
    <header>
      <div class="brand">
        <img src="logo.png" alt="SKY-BYTE Logo" class="header-logo" />
        <h1>SKY-BYTE</h1>
      </div>
      
      <div class="header-controls">
        <!-- 🔊 Weather Ambient Soundscape Toggle Button -->
        <button id="soundscape-btn" class="glass-btn sound-btn" title="Toggle Weather Audio Ambient Soundscape">
          <span id="sound-icon">🔇</span> <span class="btn-text">Sound</span>
        </button>

        <!-- Creative Animated Theme Switch -->
        <label class="theme-switch" title="Toggle Day / Night Mode">
          <input type="checkbox" id="toggle-mode-checkbox">
          <span class="switch-slider">
            <span class="switch-icon sun">☀️</span>
            <span class="switch-icon moon">🌙</span>
          </span>
        </label>
      </div>
    </header>

    <!-- Top Search Bar with Voice Search Button -->
    <div class="search-container">
      <div class="search card glass-panel">
        <input id="search-input" placeholder="Search city..." autocomplete="off" />
        <button id="mic-btn" class="mic-btn" title="Voice Search">🎙️</button>
        <button id="search-btn">Search</button>
      </div>
      <div id="autocomplete-list" class="autocomplete-dropdown glass-panel"></div>
    </div>

    <!-- Quick Favorite Cities Chips Bar -->
    <div class="favorites-bar">
      <span class="fav-label">Popular:</span>
      <div id="fav-chips" class="fav-chips-container">
        <button class="fav-chip" data-city="London">🇬🇧 London</button>
        <button class="fav-chip" data-city="New York">🇺🇸 New York</button>
        <button class="fav-chip" data-city="Tokyo">🇯🇵 Tokyo</button>
        <button class="fav-chip" data-city="Paris">🇫🇷 Paris</button>
        <button class="fav-chip" data-city="Dubai">🇦🇪 Dubai</button>
        <button class="fav-chip" data-city="Sydney">🇦🇺 Sydney</button>
      </div>
    </div>

    <p class="notification" id="notification"></p>
    <div class="loader" id="loader"></div>

    <!-- Main Dashboard 2-Column Grid Layout -->
    <div class="dashboard-grid">

      <!-- LEFT COLUMN: 5-Day Forecast Sidebar -->
      <aside class="sidebar-forecast">
        <div class="section-title-row">
          <h3>5-Day Forecast</h3>
        </div>
        <div id="forecast" class="forecast-vertical"></div>
      </aside>

      <!-- RIGHT COLUMN: Main Glassmorphism Box & Weather Stats -->
      <main class="main-content">
        <section class="main card glass-panel">
          <div class="main-header-row">
            <span class="badge" id="geo-badge">📍 Current Location</span>
            <span class="clothing-tip-badge" id="clothing-tip">💡 Tip: Loading...</span>
          </div>
          <div class="weather-hero">
            <div id="weather-icon-container" class="weather-icon-hero"></div>
            <div class="hero-temp-details">
              <h2 id="temp" title="Click to toggle °C / °F">--°C</h2>
              <p id="desc">---</p>
              <p id="location">---</p>
              <p id="time">---</p>
            </div>
          </div>
        </section>

        <!-- Advanced Sub-Features Grid (Air Quality, Sunrise/Sunset, UV & Humidity Meter) -->
        <section class="sub-features-row">
          <div class="card glass-panel air-card">
            <span class="card-label">🍃 Air Quality</span>
            <span id="aqi-val" class="aqi-badge">--</span>
          </div>

          <div class="card glass-panel sun-time-card">
            <span>🌅 Sunrise <strong id="sunrise-time">--:--</strong></span>
            <span>🌇 Sunset <strong id="sunset-time">--:--</strong></span>
          </div>

          <div class="card glass-panel uv-card">
            <span class="card-label">☀️ UV Index</span>
            <span id="uv-badge" class="uv-badge">--</span>
          </div>
        </section>

        <section class="stats-container">
          <div class="stats">
            <div class="card glass-panel">Feels <span id="feels">--</span>°</div>
            <div class="card glass-panel">Humidity <span id="humidity">--</span>%</div>
            <div class="card glass-panel">Pressure <span id="pressure">--</span> hPa</div>
            <div class="card glass-panel">Wind <span id="wind">--</span> km/h</div>
            <div class="card glass-panel">Min <span id="min">--</span>°</div>
            <div class="card glass-panel">Max <span id="max">--</span>°</div>
          </div>

          <div class="wind-card card glass-panel">
            <span>Wind Direction</span>
            <svg id="arrow" viewBox="0 0 24 24">
              <line x1="12" y1="20" x2="12" y2="4" />
              <polyline points="5 11 12 4 19 11" />
            </svg>
          </div>
        </section>
      </main>

    </div>
  </div>

  <script src="weather-icons.js"></script>
  <script src="app.js"></script>
</body>

</html>
